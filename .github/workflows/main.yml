name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ekstrak zip dan build APK
        run: |
          unzip -o JadwalPiket.zip
          cd JadwalPiket
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JadwalPiket-apk
          path: JadwalPiket/app/build/outputs/apk/debug/app-debug.apk
